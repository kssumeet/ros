name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for QA
        run: npx playwright install --with-deps chromium

      - name: SEO pack checks
        run: python3 tools/seo/build_pack.py

      - name: Build and run QA
        run: npm test

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: ros-site
          path: |
            dist/
            dist-single/
